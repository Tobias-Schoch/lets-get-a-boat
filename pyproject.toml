[project]
name = "lets-get-a-boat"
version = "0.1.0"
description = "Monitor Konstanz boat-mooring pages and notify on relevant changes."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "sqlalchemy>=2.0",
    "apscheduler>=3.10",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[tool.uv]
package = false
