services:
  app:
    build: .
    image: lets-get-a-boat:latest
    pull_policy: never            # local image only — never try to pull from a registry
    container_name: lets-get-a-boat
    restart: unless-stopped
    environment:
      # required for notifications (set in Portainer env vars)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # operational defaults — usually no need to override
      DATA_DIR: /data
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - boat-data:/data
    # No ports here. The Nginx Proxy Manager reaches this container by name
    # over the shared network below — a host port would not be needed for that,
    # but it would very much be reachable from the internet.
    #
    # This used to publish "3000:8000" on every address, so the site was also
    # served at http://<vps-ip>:3000 — bypassing the proxy and TLS. Nobody
    # noticed because Docker writes its port publications straight into
    # iptables and bypasses ufw: "ufw status" never listed it.
    networks:
      - npm

volumes:
  boat-data:

# Shared network with the Nginx Proxy Manager. It reaches the container by
# name there, so no port has to be open on the host. Must already exist or the
# stack refuses to start:  docker network create npm-network
networks:
  npm:
    external: true
    name: npm-network
